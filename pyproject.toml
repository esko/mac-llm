[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-llm"
version = "0.1.0"
description = "24 GB Apple Silicon Mac Mini local-agent runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mac-llm = "mac_llm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mac_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
