name: Agent task
description: Small implementation task for an agent worker
title: "[Agent] "
labels:
  - agent:draft
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be achieved?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant milestone/project context.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checklist. Keep it small.
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests / commands
      description: Tests, commands, or artifacts expected.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Likely files
      description: Advisory list of likely files to inspect or touch.
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must not be done.
    validations:
      required: true

  - type: dropdown
    id: worker
    attributes:
      label: Recommended worker
      options:
        - claude
        - cursor
        - codex
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - xs
        - s
        - m
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: textarea
    id: stop
    attributes:
      label: Stop condition
      description: Usually “open PR, complete Codex loop, mark ready for human.”
    validations:
      required: true

  - type: textarea
    id: codex_focus
    attributes:
      label: Codex review focus
      description: What Codex should pay special attention to.
    validations:
      required: false
